/* planloft-color-schemes: light dark */
:root {
  color-scheme: light dark;
  --planloft-font-body: Baskerville, "Libre Baskerville", "Baskerville Old Face", "Hoefler Text", "Iowan Old Style", "Palatino Linotype", Georgia, serif;

  --planloft-font-mono: "SF Mono", Menlo, "Cascadia Mono", Consolas, "DejaVu Sans Mono", ui-monospace, monospace;

}

body:where(:has(> .planloft-plan > .planloft-prose)) {
  margin: 0;
  background: var(--planloft-paper, Canvas);
  color: var(--planloft-ink, CanvasText);
  -webkit-text-size-adjust: 100%;
}
:where(.planloft-plan:has(> .planloft-prose)) { padding-block: 4.5rem 7rem; }
:where(.planloft-prose) {
  background: var(--planloft-paper, Canvas);
  color: var(--planloft-ink, CanvasText);
  font-family: var(--planloft-font-body, system-ui, sans-serif);
  font-size: var(--planloft-font-size, 17px);
  line-height: var(--planloft-line-height, 1.6);
  font-kerning: normal;
  text-rendering: optimizeLegibility;
  overflow-wrap: break-word;
}
:where(.planloft-prose) *, :where(.planloft-prose) *::before, :where(.planloft-prose) *::after { box-sizing: border-box; }
:where(.planloft-prose) > :first-child { margin-top: 0; }
:where(.planloft-prose) > :last-child { margin-bottom: 0; }

:where(.planloft-prose) :is(h1, h2, h3, h4, h5, h6) {
  color: var(--planloft-ink, CanvasText);
  font-family: var(--planloft-font-heading, var(--planloft-font-body, system-ui, sans-serif));
  font-weight: var(--planloft-heading-weight, 650);
  line-height: var(--planloft-heading-line-height, 1.2);
  letter-spacing: var(--planloft-heading-tracking, 0);
  text-wrap: balance;
  overflow-wrap: anywhere;
}
:where(.planloft-prose) h1 { margin: 0 0 0.6em; font-size: var(--planloft-h1-size, 2.2em); }
:where(.planloft-prose) h2 { margin: 1.8em 0 0.5em; font-size: var(--planloft-h2-size, 1.5em); }
:where(.planloft-prose) h3 { margin: 1.6em 0 0.45em; font-size: var(--planloft-h3-size, 1.18em); }
:where(.planloft-prose) h4 { margin: 1.5em 0 0.4em; font-size: 1em; }
:where(.planloft-prose) h5 { margin: 1.4em 0 0.35em; font-size: 1em; color: var(--planloft-muted, GrayText); }
:where(.planloft-prose) h6 { margin: 1.4em 0 0.35em; font-size: 1em; font-weight: 500; font-style: italic; color: var(--planloft-muted, GrayText); }
:where(.planloft-prose) :is(h1, h2, h3) + :is(h2, h3, h4) { margin-top: 0.8em; }
/* A linked heading keeps the heading's colour and carries a thin accent underline, so
   it reads as a link without hover; hover strengthens the line. */
:where(.planloft-prose) :is(h1, h2, h3, h4, h5, h6) a {
  color: inherit;
  text-decoration: underline;
  text-decoration-thickness: 0.06em;
  text-decoration-color: color-mix(in srgb, var(--planloft-accent, LinkText) 55%, transparent);
  text-underline-offset: 0.14em;
}
:where(.planloft-prose) :is(h1, h2, h3, h4, h5, h6) a:hover { text-decoration-color: var(--planloft-accent, LinkText); }
/* The paragraph after the title is the summary; it reads a step larger and quieter. */
:where(.planloft-prose) h1 + p { font-size: 1.12em; color: var(--planloft-muted, GrayText); }

:where(.planloft-prose) p { margin: 0 0 1.2em; text-wrap: pretty; }
:where(.planloft-prose) :is(ul, ol) { margin: 0 0 1.2em; padding-left: 1.6em; }
:where(.planloft-prose) li { margin: 0.3em 0; }
:where(.planloft-prose) li > p { margin-bottom: 0.6em; }
:where(.planloft-prose) li :is(ul, ol) { margin: 0.3em 0 0.4em; }
:where(.planloft-prose) li::marker { color: var(--planloft-muted, GrayText); }
:where(.planloft-prose) ul:has(> li > input[type="checkbox"]) { list-style: none; padding-left: 0.2em; }
:where(.planloft-prose) li > input[type="checkbox"] { margin: 0 0.55em 0 0; vertical-align: -0.1em; accent-color: var(--planloft-accent, currentColor); }
:where(.planloft-prose) dl { margin: 0 0 1.2em; }
:where(.planloft-prose) dt { font-weight: var(--planloft-heading-weight, 650); }
:where(.planloft-prose) dd { margin: 0 0 0.6em 1.6em; }

:where(.planloft-prose) a {
  color: var(--planloft-accent, LinkText);
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-decoration-color: color-mix(in srgb, currentColor 45%, transparent);
  text-underline-offset: 0.18em;
}
:where(.planloft-prose) a:hover { text-decoration-color: currentColor; }
:where(.planloft-prose) strong { font-weight: 700; }
:where(.planloft-prose) mark { padding: 0 0.15em; background: color-mix(in srgb, var(--planloft-caution, #b98100) 28%, var(--planloft-paper, Canvas)); color: inherit; }
:where(.planloft-prose) del { color: var(--planloft-muted, GrayText); }
:where(.planloft-prose) abbr[title] { text-decoration: underline dotted; text-underline-offset: 0.18em; }
:where(.planloft-prose) :is(sup, sub) { font-size: 0.78em; line-height: 0; }
:where(.planloft-prose) small { font-size: 0.86em; }

:where(.planloft-prose) :is(code, kbd, samp, pre) {
  font-family: var(--planloft-font-mono, ui-monospace, Menlo, Consolas, monospace);
  font-size: var(--planloft-code-size, 0.88em);
}
:where(.planloft-prose) code {
  padding: 0.1em 0.3em;
  border-radius: 3px;
  background: var(--planloft-code-paper, color-mix(in srgb, CanvasText 7%, Canvas));
  color: var(--planloft-code-ink, inherit);
}
:where(.planloft-prose) pre {
  margin: 1.4em 0;
  padding: 0.95em 1.1em;
  overflow-x: auto;
  border-radius: 4px;
  background: var(--planloft-code-paper, color-mix(in srgb, CanvasText 7%, Canvas));
  color: var(--planloft-code-ink, inherit);
  line-height: 1.55;
  tab-size: 2;
}
:where(.planloft-prose) pre code { padding: 0; border-radius: 0; background: transparent; color: inherit; font-size: 1em; }
:where(.planloft-prose) kbd {
  padding: 0.05em 0.4em;
  border: 1px solid var(--planloft-rule, color-mix(in srgb, CanvasText 18%, Canvas));
  border-bottom-width: 2px;
  border-radius: 4px;
  background: var(--planloft-surface, color-mix(in srgb, CanvasText 5%, Canvas));
  font-size: 0.82em;
}

:where(.planloft-prose) blockquote {
  margin: 1.4em 0;
  padding: 0.1em 0 0.1em 1.1em;
  border-left: 3px solid var(--planloft-rule, color-mix(in srgb, CanvasText 18%, Canvas));
  color: var(--planloft-muted, GrayText);
}
:where(.planloft-prose) blockquote > :last-child { margin-bottom: 0; }
:where(.planloft-prose) blockquote cite { font-style: normal; }

/* Tables keep their natural width and scroll sideways instead of breaking the page. */
:where(.planloft-prose) table {
  display: block;
  width: max-content;
  max-width: 100%;
  margin: 1.4em 0;
  overflow-x: auto;
  border-collapse: collapse;
  line-height: 1.45;
  font-size: 0.94em;
}
:where(.planloft-prose) :is(th, td) {
  padding: 0.45em 1.1em 0.45em 0;
  border-bottom: 1px solid var(--planloft-rule, color-mix(in srgb, CanvasText 18%, Canvas));
  text-align: left;
  vertical-align: top;
}
:where(.planloft-prose) tr > :last-child { padding-right: 0; }
:where(.planloft-prose) thead th { font-weight: var(--planloft-heading-weight, 650); border-bottom: 2px solid var(--planloft-ink, CanvasText); }
:where(.planloft-prose) tbody th { font-weight: 600; }
:where(.planloft-prose) td:has(> :is(code, kbd):only-child) { white-space: nowrap; }

:where(.planloft-prose) hr { height: 0; margin: 2.8em 0; border: 0; border-top: 1px solid var(--planloft-rule, color-mix(in srgb, CanvasText 18%, Canvas)); }
:where(.planloft-prose) img, :where(.planloft-prose) video, :where(.planloft-prose) svg:not(.pl-chart__svg) { max-width: 100%; height: auto; }
:where(.planloft-prose) figure { margin: 1.6em 0; }
:where(.planloft-prose) figcaption { margin-top: 0.5em; color: var(--planloft-muted, GrayText); font-size: 0.9em; }
:where(.planloft-prose) details {
  margin: 1.2em 0;
  padding: 0.6em 0.9em;
  border: 1px solid var(--planloft-rule, color-mix(in srgb, CanvasText 18%, Canvas));
  border-radius: 4px;
}
:where(.planloft-prose) summary { cursor: pointer; font-weight: 600; }
:where(.planloft-prose) details[open] > summary { margin-bottom: 0.5em; }

:where(.planloft-prose) ::selection { background: color-mix(in srgb, var(--planloft-accent, Highlight) 24%, transparent); }
:where(.planloft-prose) :focus-visible { outline: 2px solid var(--planloft-accent, currentColor); outline-offset: 3px; }
:where(.planloft-plan) > .planloft-comments {
  margin-top: 4rem;
  padding-top: 2rem;
  border-top: 1px solid var(--planloft-rule, color-mix(in srgb, CanvasText 18%, Canvas));
}

@media (max-width: 40rem) {
  :where(.planloft-plan:has(> .planloft-prose)) { padding-block: 4.25rem 5rem; }
  :where(.planloft-prose) { font-size: calc(var(--planloft-font-size, 17px) * 0.94); }
  :where(.planloft-prose) h1 { font-size: calc(var(--planloft-h1-size, 2.2em) * 0.82); }
}
@media print {
  :where(.planloft-plan:has(> .planloft-prose)) { padding-block: 0; }
  :where(.planloft-prose) { font-size: 11pt; }
  :where(.planloft-prose) a { text-decoration-color: currentColor; }
  :where(.planloft-prose) :is(pre, blockquote, table, figure) { break-inside: avoid; }
}


.pl-callout, .pl-stats, .pl-stat, .pl-status, .pl-badge, .pl-checklist, .pl-todo, .pl-timeline, .pl-milestone, .pl-chart, .pl-sparkline, .pl-table, .pl-scroll, .pl-tip {
  --pl-ink: var(--planloft-ink, CanvasText);
  --pl-paper: var(--planloft-paper, Canvas);
  --pl-muted: var(--planloft-muted, color-mix(in srgb, var(--pl-ink) 62%, var(--pl-paper)));
  --pl-surface: var(--planloft-surface, color-mix(in srgb, var(--pl-ink) 5%, var(--pl-paper)));
  --pl-rule: var(--planloft-rule, color-mix(in srgb, var(--pl-ink) 16%, var(--pl-paper)));
  --pl-accent: var(--planloft-accent, var(--pl-ink));
  --pl-accent-contrast: var(--planloft-accent-contrast, var(--pl-paper));
  --pl-series-1: var(--planloft-chart-1, #2a78d6);
  --pl-series-2: var(--planloft-chart-2, #eb6834);
  --pl-series-3: var(--planloft-chart-3, #1baf7a);
  --pl-series-4: var(--planloft-chart-4, #6250d6);
  --pl-series-5: var(--planloft-chart-5, #e87ba4);
  --pl-series-6: var(--planloft-chart-6, #eda100);
  --pl-sequential: var(--planloft-chart-sequential, var(--pl-series-1));
  --pl-neutral: var(--planloft-chart-neutral, color-mix(in srgb, var(--pl-ink) 52%, var(--pl-paper)));
  --pl-positive: var(--planloft-positive, #1f8a52);
  --pl-negative: var(--planloft-negative, #c8412b);
  --pl-caution: var(--planloft-caution, #b98100);
  --pl-font-body: var(--planloft-font-body, inherit);
  --pl-font-heading: var(--planloft-font-heading, var(--pl-font-body));
  --pl-font-mono: var(--planloft-font-mono, ui-monospace, Menlo, Consolas, monospace);
  --pl-heading-weight: var(--planloft-heading-weight, 650);
  --pl-radius: 6px;
}

.pl-sr {
  position: absolute;
  width: 1px;
  height: 1px;
  margin: -1px;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
}
/* Hidden chart tables must not become keyboard-focusable scroll containers. */
.pl-chart__data table { display: table; max-width: none; overflow: visible; }
.pl-scroll { max-width: 100%; overflow-x: auto; }
.pl-scroll > table { display: table; width: 100%; max-width: none; margin: 0; overflow: visible; }
.pl-num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }

/* Callout */
.pl-callout {
  --pl-tone: var(--pl-accent);
  margin: 1.6em 0;
  padding: 0.85em 1.1em 0.9em;
  border-inline-start: 3px solid var(--pl-tone);
  border-radius: 0 var(--pl-radius) var(--pl-radius) 0;
  background: color-mix(in srgb, var(--pl-tone) 7%, var(--pl-paper));
}
.pl-callout[data-tone="note"] { --pl-tone: var(--pl-muted); }
.pl-callout[data-tone="tip"] { --pl-tone: var(--pl-positive); }
.pl-callout[data-tone="warning"] { --pl-tone: var(--pl-caution); }
.pl-callout[data-tone="risk"] { --pl-tone: var(--pl-negative); }
.pl-callout[data-tone="decision"] { --pl-tone: var(--pl-accent); }
.pl-callout__heading {
  font-family: var(--pl-font-heading);
  display: flex;
  flex-wrap: wrap;
  gap: 0.15em 0.6em;
  align-items: baseline;
  margin: 0 0 0.35em;
  line-height: 1.35;
}
.pl-callout__tone { font-weight: var(--pl-heading-weight); }
.pl-callout__title { font-weight: var(--pl-heading-weight); }
.pl-callout__body > :first-child { margin-top: 0; }
.pl-callout__body > :last-child { margin-bottom: 0; }

/* Stat and Stats */
.pl-stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 11.5rem), 1fr));
  gap: 1.25rem 2rem;
  margin: 1.75em 0;
}
.pl-stat { min-width: 0; padding-top: 0.7rem; border-top: 1px solid var(--pl-rule); }
.pl-stats > .pl-stat { margin: 0; }
.pl-stat__label { margin: 0; color: var(--pl-muted); font-size: 0.86em; line-height: 1.35; }
.pl-stat__value {
  font-family: var(--pl-font-heading);
  margin: 0.15rem 0 0.1rem;
  font-size: 2em;
  font-weight: var(--pl-heading-weight);
  line-height: 1.1;
  letter-spacing: -0.015em;
  overflow-wrap: anywhere;
}
.pl-stat__change { margin: 0; font-size: 0.86em; font-weight: 600; font-variant-numeric: tabular-nums; }
.pl-stat__change[data-assessment="good"] .pl-stat__arrow { color: var(--pl-positive); }
.pl-stat__change[data-assessment="bad"] .pl-stat__arrow { color: var(--pl-negative); }
.pl-stat__arrow { display: inline-block; margin-inline-end: 0.2em; }
.pl-stat__period { color: var(--pl-muted); font-weight: 400; }
.pl-stat .pl-sparkline { display: block; width: 6.5em; height: 1.6em; margin-top: 0.5rem; color: var(--pl-muted); }
.pl-stat__note { margin-top: 0.4rem; color: var(--pl-muted); font-size: 0.86em; }
.pl-stat__note > :first-child { margin-top: 0; }
.pl-stat__note > :last-child { margin-bottom: 0; }

/* Status */
.pl-status {
  --pl-tone: var(--pl-muted);
  display: inline-flex;
  align-items: center;
  gap: 0.4em;
  padding: 0.05em 0.6em 0.1em 0.5em;
  border: 1px solid color-mix(in srgb, var(--pl-tone) 45%, transparent);
  border-radius: 999px;
  background: color-mix(in srgb, var(--pl-tone) 10%, var(--pl-paper));
  color: var(--pl-ink);
  font-size: 0.82em;
  font-weight: 600;
  line-height: 1.5;
  white-space: nowrap;
  vertical-align: 0.08em;
}
.pl-status::before { color: var(--pl-tone); font-size: 0.85em; line-height: 1; }
.pl-status[data-tone="done"] { --pl-tone: var(--pl-positive); }
.pl-status[data-tone="done"]::before { content: "\2713"; }
.pl-status[data-tone="on-track"] { --pl-tone: var(--pl-positive); }
.pl-status[data-tone="on-track"]::before { content: "\25CF"; }
.pl-status[data-tone="at-risk"] { --pl-tone: var(--pl-caution); }
.pl-status[data-tone="at-risk"]::before { content: "\25B2"; }
.pl-status[data-tone="blocked"] { --pl-tone: var(--pl-negative); }
.pl-status[data-tone="blocked"]::before { content: "\25A0"; }
.pl-status[data-tone="not-started"]::before { content: "\25CB"; }

/* Todo and Checklist */
.pl-checklist { margin: 1.5em 0; }

.frame { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }

.scroll-x { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
#matrix-svg { display: block; min-width: 760px; width: 100%; height: auto; }

.m-bg { fill: var(--sunk); }

.m-note { font-size: 9.5px; fill: var(--ink); font-family: var(--font-text); }

.m-lead { stroke: var(--hi-in); stroke-width: 0.7; fill: none; }

.fill0 { fill: var(--d0); } .fill1 { fill: var(--d1); } .fill2 { fill: var(--d2); } .fill3 { fill: var(--d3); }
.fill4 { fill: var(--d4); } .fill5 { fill: var(--d5); } .fill6 { fill: var(--d6); } .fill7 { fill: var(--d7); }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; flex: none; }
.bg0 { background: var(--d0); } .bg1 { background: var(--d1); } .bg2 { background: var(--d2); } .bg3 { background: var(--d3); }
.bg4 { background: var(--d4); } .bg5 { background: var(--d5); } .bg6 { background: var(--d6); } .bg7 { background: var(--d7); }

.callout { border-left: 3px solid var(--accent); padding: 4px 0 4px 16px; max-width: 70ch; font-size: 1.02rem; }

/* View tabs */
.tabs { display: flex; flex-wrap: wrap; gap: 6px; border-bottom: 1px solid var(--line); }
.tab { appearance: none; border: 0; background: none; font: inherit; color: var(--muted); padding: 10px 14px; border-bottom: 2px solid transparent; margin-bottom: -1px; cursor: pointer; font-weight: 500; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }

.panel { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 24px; align-items: start; }

.stage { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; min-width: 0; overflow: hidden; }
.stage-bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; padding: 10px 14px; border-bottom: 1px solid var(--line); font-size: 0.85rem; }

.toggles { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }

aside.why dt { font-family: var(--font-mono); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }

/* Domain map */
.dm-scroll { overflow-x: auto; }
.dm { position: relative; width: 100%; min-width: 780px; aspect-ratio: 1000 / 640; }
.dm-svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.dm-band { fill: none; stroke: var(--edge); stroke-opacity: 0.42; stroke-linecap: round; cursor: pointer; }

.dm-tile { position: absolute; transform: translate(-50%, -50%); width: 18.5%; display: grid; gap: 3px; text-align: left; padding: 9px 11px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; font: inherit; color: var(--ink); cursor: pointer; box-shadow: 0 1px 0 var(--line); }
.dm-tile.center { width: 20%; border-width: 1.5px; }
.dm-tile[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }

.dm-name { display: flex; align-items: center; gap: 7px; font-weight: 600; font-size: 0.92rem; }
.dm-meta { font-size: 0.76rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.dm-top { font-size: 0.76rem; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dm-int { font-size: 0.72rem; font-family: var(--font-mono); color: var(--muted); }
.detail { border-top: 1px solid var(--line); padding: 14px; display: grid; gap: 10px; font-size: 0.88rem; min-height: 96px; }
.detail h4 { margin: 0; font-size: 0.95rem; font-weight: 600; display: flex; gap: 8px; align-items: center; }
.rel-list { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
.rel-list li { display: grid; grid-template-columns: minmax(150px, max-content) 1fr; gap: 10px; }
@media (max-width: 560px) { .rel-list li { grid-template-columns: 1fr; gap: 2px; } }
.rel-list .lbls { font-family: var(--font-mono); font-size: 0.78rem; color: var(--muted); min-width: 0; overflow-wrap: anywhere; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chip { display: inline-flex; align-items: center; gap: 6px; font: inherit; font-size: 0.8rem; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; max-width: 100%; }
.chip.fam { background: var(--sunk); font-weight: 500; }
.chip:hover { border-color: var(--edge); }
.chip span.t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Bundled ring */
.hb-scroll { overflow-x: auto; }
#hb-svg { display: block; width: 100%; min-width: 640px; height: auto; max-height: 860px; }
.hb-link { fill: none; stroke: var(--edge); stroke-opacity: 0.3; }
.hb-link.out { stroke: var(--hi-out); stroke-opacity: 0.95; }
.hb-link.in { stroke: var(--hi-in); stroke-opacity: 0.95; }
.hb-link.both { stroke: var(--ink); stroke-opacity: 0.95; }

.hb-leaf.fam text { font-weight: 600; }
.hb-leaf.fade text { fill: var(--muted); opacity: 0.45; }
.hb-leaf.on text { font-weight: 600; }
.hb-loop { font-family: var(--font-mono); font-size: 8px; fill: var(--hi-in); }
.hb-dom-arc { stroke-width: 3.5; fill: none; }
.hb-dom-name { font-size: 11px; font-weight: 600; fill: var(--ink); font-family: var(--font-text); }

/* Focus lanes */
.fl-bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.crumbs { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; font-size: 0.8rem; color: var(--muted); }
.crumbs button { font: inherit; border: 0; background: none; color: var(--accent); cursor: pointer; padding: 0 2px; }
.fl { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) 210px minmax(0, 1fr); gap: 56px; padding: 18px; align-items: start; }
@media (max-width: 760px) { .fl { grid-template-columns: 1fr; gap: 14px; } #fl-svg { display: none; } }
#fl-svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.fl-col { display: grid; gap: 8px; min-width: 0; position: relative; z-index: 1; }
.fl-col h5 { margin: 0 0 2px; font-family: var(--font-mono); font-weight: 500; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.fl-group { border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; background: var(--surface); display: grid; gap: 6px; }
.fl-group header { display: flex; justify-content: space-between; gap: 8px; font-family: var(--font-mono); font-size: 0.74rem; }
.fl-group header .n { color: var(--muted); }
#fl-center-wrap { align-self: stretch; position: relative; z-index: 1; }
.fl-center { position: sticky; top: 16px; z-index: 1; border: 1.5px solid var(--accent); border-radius: 12px; padding: 14px; background: var(--surface); display: grid; gap: 8px; }
.fl-center .meta { font-size: 0.8rem; color: var(--muted); display: grid; gap: 2px; font-variant-numeric: tabular-nums; }
.fl-empty { font-size: 0.82rem; color: var(--muted); border: 1px dashed var(--line); border-radius: 8px; padding: 10px; }
.fl-conn { fill: none; stroke: var(--edge); stroke-opacity: 0.55; stroke-width: 1.2; }
.fl-conn.big { stroke-width: 2.2; }
#arrowhead path { fill: var(--edge); }

/* Rules + refs + plan */
.rules { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; padding: 0; margin: 0; list-style: none; }
.rules li { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: grid; gap: 4px; font-size: 0.9rem; }

.plan { display: grid; gap: 0; padding: 0; margin: 0; list-style: none; counter-reset: step; }
.plan li { display: grid; grid-template-columns: 44px 1fr; gap: 14px; padding: 16px 0; border-top: 1px solid var(--line); }
.plan li::before { counter-increment: step; content: counter(step); font-family: var(--font-display); font-size: 1.6rem; font-weight: 600; color: var(--accent); line-height: 1; }
.plan li div { display: grid; gap: 4px; max-width: 72ch; }
.plan li b { font-weight: 600; }
footer { font-size: 0.82rem; color: var(--muted); display: grid; gap: 6px; max-width: 80ch; border-top: 1px solid var(--line); padding-top: 18px; }

#tip { position: fixed; z-index: 20; max-width: 340px; background: var(--ink); color: var(--bg); font-size: 0.8rem; line-height: 1.45; padding: 8px 10px; border-radius: 6px; pointer-events: none; }
#tip b { font-weight: 600; }
#tip .k { font-family: var(--font-mono); font-size: 0.74rem; opacity: 0.85; }
@media (prefers-reduced-motion: no-preference) { .dm-band, .hb-link, .dm-tile { transition: stroke-opacity .15s, opacity .15s; } }


/* ---------- Mock gallery ---------- */
.st0 { stroke: var(--d0); } .st1 { stroke: var(--d1); } .st2 { stroke: var(--d2); } .st3 { stroke: var(--d3); }
.st4 { stroke: var(--d4); } .st5 { stroke: var(--d5); } .st6 { stroke: var(--d6); } .st7 { stroke: var(--d7); }
.gallery { display: grid; gap: 34px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.gallery-head { max-width: 1180px; width: 100%; margin: 0 auto; display: grid; gap: 12px; }
.mock-nav { position: sticky; top: 0; z-index: 8; background: var(--bg); border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 2px 4px; padding: 8px 120px 8px 0; font-size: 0.78rem; }
.mock-nav a { text-decoration: none; color: var(--muted); padding: 3px 8px; border-radius: 999px; border: 1px solid transparent; white-space: nowrap; }
.mock-nav a:hover, .mock-nav a:focus-visible { border-color: var(--line); color: var(--ink); }
.mock-nav a b { font-family: var(--font-mono); font-weight: 500; color: var(--accent); margin-right: 3px; }
.mock-list { display: grid; gap: 40px; }
.mock { display: grid; gap: 8px; scroll-margin-top: 52px; min-width: 0; }
.mock-head { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; align-items: baseline; }
.mock-head .num { font-family: var(--font-mono); color: var(--accent); font-size: 0.9rem; grid-row: span 2; }
.mock-head h3 { font-size: 1.3rem; }
.mock-head p { color: var(--muted); font-size: 0.86rem; max-width: 120ch; }

.mstage { position: relative; height: calc(100vh - 120px); min-height: 560px; max-height: 1100px; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); }
.mstage.scroll { overflow: auto; }

.merr { padding: 20px; color: var(--hi-in); }
.legend { position: absolute; left: 10px; top: 10px; z-index: 3; display: flex; flex-wrap: wrap; gap: 3px 10px; max-width: min(560px, 70%); font-size: 0.72rem; background: color-mix(in srgb, var(--surface) 88%, transparent); padding: 6px 9px; border-radius: 8px; border: 1px solid var(--line); pointer-events: none; }
.legend span { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.dark .legend { background: rgba(10, 13, 20, 0.75); border-color: #1B2130; color: #C9D2E6; }
.mtools { position: absolute; right: 10px; top: 10px; z-index: 5; display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.mhint { position: absolute; right: 10px; bottom: 10px; z-index: 3; font-size: 0.72rem; color: var(--muted); background: color-mix(in srgb, var(--surface) 88%, transparent); padding: 4px 8px; border-radius: 6px; pointer-events: none; }
.dark .mhint { color: #9AA6BF; background: rgba(10, 13, 20, 0.75); }
.mpanel { position: absolute; left: 10px; bottom: 10px; z-index: 4; max-width: min(420px, 45%); max-height: 46%; overflow: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font-size: 0.8rem; display: grid; gap: 6px; box-shadow: 0 4px 18px color-mix(in srgb, var(--ink) 10%, transparent); }

/* Node-link basics shared by the SVG mocks */
.mstage .e { fill: none; stroke: var(--edge); stroke-opacity: 0.2; }
.mstage .e.ctx { stroke-opacity: 0.07; }
.mstage .e.hid { stroke-opacity: 0; }

.mstage .n text.lbl-off { display: none; }
.mstage .n.hub text { font-weight: 600; font-size: 11.5px; }
.mstage svg.focus .e { stroke-opacity: 0.03; }
.mstage svg.focus .e.out { stroke: var(--hi-out); stroke-opacity: 0.9; }
.mstage svg.focus .e.in { stroke: var(--hi-in); stroke-opacity: 0.9; }
.mstage svg.focus .e.both { stroke: var(--ink); stroke-opacity: 0.9; }
.mstage svg.focus .n { opacity: 0.18; }
.mstage svg.focus .n.nb, .mstage svg.focus .n.on { opacity: 1; }
.mstage svg.focus .n.nb text.lbl-off, .mstage svg.focus .n.on text.lbl-off { display: inline; }
.mstage svg.focus .n.on text { font-weight: 600; }

/* 2 Constellation */
.dark .e { stroke: #8FA3D9; stroke-opacity: 0.075; vector-effect: non-scaling-stroke; }
.dark .n circle { stroke: none; }
.dark .n text { fill: #DCE3F2; stroke: #0A0D14; font-size: calc(11px / var(--k, 1)); opacity: 0; }
.dark .n text.keep { opacity: 1; }
.dark svg.z2 .n text { opacity: 1; }
.dark .dlab { font-size: calc(15px / var(--k, 1)); letter-spacing: 0.14em; fill-opacity: 0.85; font-family: var(--font-text); font-weight: 600; pointer-events: none; text-anchor: middle; }
.dark svg.z2 .dlab { fill-opacity: 0.18; }
.dark svg.focus .e { stroke-opacity: 0.02; }
.dark svg.focus .e.out { stroke: #8CF5C0; stroke-opacity: 0.95; }
.dark svg.focus .e.in { stroke: #FFB27A; stroke-opacity: 0.95; }
.dark svg.focus .e.both { stroke: #FFFFFF; stroke-opacity: 0.95; }
.dark svg.focus .n.nb text, .dark svg.focus .n.on text { opacity: 1; }
.dark svg.focus .n.on text { font-weight: 700; }

/* 3 Territories */
.hull { fill-opacity: 0.08; stroke-opacity: 0.45; stroke-width: 1.2; }
.hull-name { font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; font-family: var(--font-text); }
.road { fill: none; stroke: var(--edge); stroke-opacity: 0.22; stroke-linecap: round; }
.road:hover { stroke-opacity: 0.55; }
.mstage svg.focus .road { stroke-opacity: 0.05; }
.mstage svg.focus .e.hid.out, .mstage svg.focus .e.hid.in, .mstage svg.focus .e.hid.both { stroke-opacity: 0.85; }

/* 4 Domain tiles */
.tile4 { position: absolute; transform: translate(-50%, -50%); display: grid; gap: 4px; padding: 9px 11px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; font: inherit; color: var(--ink); text-align: left; cursor: pointer; z-index: 2; }
.tile4.center { border-width: 1.5px; }
.tile4[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.tile4.dim { opacity: 0.4; }
.tile4 .nm { display: flex; align-items: center; gap: 7px; font-weight: 600; font-size: 0.9rem; }
.tile4 .meta { font-size: 0.72rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.tile4 .chips { gap: 3px; }
.tile4 .chip { font-size: 0.68rem; padding: 1px 6px; cursor: inherit; }
.band { fill: none; stroke: var(--edge); stroke-opacity: 0.4; stroke-linecap: round; }
.band.on { stroke: var(--accent); stroke-opacity: 0.85; }
.band.off { stroke-opacity: 0.07; }
.bpill circle { fill: var(--surface); stroke: var(--line); }
.bpill text { font-size: 11px; font-family: var(--font-mono); fill: var(--ink); text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.bpill.off { opacity: 0.12; }

/* 5 Nested boxes */
.box5 { position: absolute; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); display: flex; flex-direction: column; overflow: hidden; }
.box5 header { padding: 7px 10px; display: grid; gap: 1px; border-bottom: 1px solid var(--line); cursor: default; }
.box5 header .nm { display: flex; align-items: center; gap: 7px; font-weight: 600; font-size: 0.86rem; }
.box5 header .meta { font-size: 0.7rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pills { display: flex; flex-wrap: wrap; gap: 4px; padding: 8px; overflow: auto; align-content: flex-start; }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 0.74rem; padding: 2px 8px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); cursor: pointer; white-space: nowrap; }
.pill.fam { background: var(--sunk); font-weight: 600; }
.stage5.focus .pill { opacity: 0.28; }
.stage5.focus .pill.on, .stage5.focus .pill.nb { opacity: 1; }
.stage5 .pill.on { border-color: var(--ink); }
.ov5 path { fill: none; stroke-opacity: 0.85; }
.ov5 path.out { stroke: var(--hi-out); } .ov5 path.in { stroke: var(--hi-in); } .ov5 path.both { stroke: var(--ink); }
.ov5 path.agg { stroke: var(--accent); stroke-opacity: 0.6; stroke-linecap: round; }
.ov5 text { font-size: 11px; font-family: var(--font-mono); fill: var(--ink); paint-order: stroke; stroke: var(--surface); stroke-width: 3px; }

/* 6 Context band */
.bandbg { fill: var(--sunk); }
.bandlab { font-size: 11px; fill: var(--muted); font-family: var(--font-mono); letter-spacing: 0.06em; }

/* 7 Flow */
.colhead { font-size: 11px; fill: var(--muted); font-family: var(--font-mono); letter-spacing: 0.06em; text-transform: uppercase; }

/* 9 Chord */
.ribbon { fill-opacity: 0.6; stroke: none; }

  const key = "planloft-color-scheme";
  let saved = null;

  const update = () => {
    if (selected === "system") delete root.dataset.planloftColorScheme;
    else root.dataset.planloftColorScheme = selected;
    const effective = selected === "system" ? (media.matches ? "dark" : "light") : selected;

      option.setAttribute("aria-pressed", String(optionName === selected));
      if (optionName === "system") option.title = `System theme (currently ${effective})`;

  const HIT = ".pl-chart__hits > *";

    heading.textContent = title;
    tip.append(heading);
    for (const row of rows) {
      const split = row.lastIndexOf(": ");
      const line = document.createElement("div");
      line.className = "pl-tip__row";
      const label = document.createElement("span");
      label.className = "pl-tip__label";
      label.textContent = split < 0 ? row : row.slice(0, split);
      const value = document.createElement("span");
      value.className = "pl-tip__value";
      value.textContent = split < 0 ? "" : row.slice(split + 2);

<h2>Things learned about the data</h2>
<ul>
<li>The prod graph has 124 types, 1,077 relationships and 192 relationship names. 726 of the 7,626 possible type pairs are linked.</li>
<li>Most density comes from rules applied across whole families of types: <code>SUPERSEDES</code> (19 × 19 document types, 361 edges), <code>PARENT_OF</code> and <code>DUPLICATE_OF</code> among ticket types, <code>HAS_ATTACHMENT</code> from Email and Message to 20 document types.</li>
<li>Four sets of types share almost identical relationships and can be merged (&quot;MSA + 17 similar&quot;, &quot;Regression + 5 similar&quot;, &quot;Email, Message&quot;, &quot;Hotel Expense, Flight Expenses&quot;). Merging them cuts 1,077 lines to 326.</li>
<li>Every type has the category Core, so the existing category legend separates nothing.</li>
<li>The API returns no record counts per relationship and no mapping from types to source systems.</li>
<li>Every relationship carries its join keys (for example <code>pullRequest_id → serviceName</code>), which make good tooltips.</li>
<li>The product&#39;s <code>--graph-node-*</code> colour tokens are very dark in dark mode; prototypes use each token&#39;s light-mode hue there instead.</li>
</ul>
<h2>How each round was run</h2>
<p>Each round followed the same loop: build on real data, deploy with planloft, review by Gemini 4 Neon and GPT-6.2 Sol in a real browser at 1440×900 and 1672×976 in light and dark, fix everything fixable, have Sol re-check, then hand over to Hatim. Hatim&#39;s own verdicts decide what survives; reviewer verdicts are recorded for comparison.</p>
<h2>Prototype (round 4)</h2>
<p>Built in <code>~/work/unify-prototypes/apps/prototypes/src/app/prototypes/ecg-grouped-graph/</code> from the repo&#39;s <code>details-canvas-aside</code> template, using only design-system components and tokens.</p>
<ul>
<li><strong>Shell:</strong> app sidebar (with an Enterprise Context Graph entry under AI Ontology &amp; Data), breadcrumb, serif title with &quot;124 types · 1,077 relationships · 9 groups&quot;, Graph / Nodes / Edges / Sources / Records tabs, Share and Publish, the node list inside the canvas card as in production.</li>
<li><strong>Canvas:</strong> the round 3 grouped view: three zoom levels, magnification capped so nothing leaves the canvas, bands with counts between groups, one search box that filters the list and finds a type (opening its family in place), a legend of groups instead of Core / Secondary / Derived.</li>
<li><strong>Colours:</strong> group colours use the design system&#39;s <code>utility</code> palette steps that match the product&#39;s <code>--graph-node-*</code> hexes, with a dark-mode step that keeps each group&#39;s light hue.</li>
<li><strong>Deviations from the frame:</strong> the node list sits inside the canvas card, and the frame&#39;s 480px side panel is dropped; both are recorded in the prototype&#39;s <code>docs/decisions.md</code>.</li>
